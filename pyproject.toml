[project]
name = "gqe"
version = "1.0.0"
description = "Grouped Query Experts: Mixture-of-Experts on GQA Self-Attention"
authors = [
    { name = "Vishesh Tripathi" },
    { name = "Abhay Kumar" },
    { name = "FrontiersMind" },
]
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = [
    "artificial intelligence",
    "transformers",
    "mixture of experts",
    "attention",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
]
dependencies = [
    "torch>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/FrontiersMindAI/GQE"
Repository = "https://github.com/FrontiersMindAI/GQE"
Paper = "https://arxiv.org/abs/2606.20945"

[project.optional-dependencies]
lightning = [
    "lightning>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["gqe"]
